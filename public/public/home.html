<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA-SELLING-X TERMINAL</title>
    <style>
        /* 🌌 ULTIMATE CYBERPUNK MATTE BLACK & GHOST WHITE INFRASTRUCTURE */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080808; color: #F5F5F5; overflow-x: hidden; padding-bottom: 90px; }
        .app-container { padding: 15px; max-width: 480px; margin: 0 auto; }
        
        /* 🛡️ TOP SECURITY PRIVACY BANNER */
        .security-banner { 
            background-color: #121212; border: 1px solid #1c1c1c; border-radius: 12px; 
            padding: 14px; margin-bottom: 15px; font-size: 11px; line-height: 1.5; color: #888888; 
            text-align: justify; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .security-banner span { color: #FFFFFF; font-weight: bold; }
        
        /* 🟢 24/7 LIVE AUTOMATED SERVER STATE INDICATOR */
        .server-status-badge {
            background-color: #121212; border: 1px solid #1c1c1c; border-radius: 20px;
            padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: bold; color: #FFFFFF; letter-spacing: 0.5px; margin-bottom: 25px;
        }
        .live-dot {
            width: 8px; height: 8px; background-color: #00FFCC; border-radius: 50%;
            box-shadow: 0 0 10px #00FFCC; animation: pulseGlow 1.5s infinite ease-in-out;
        }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* 🔮 CENTER CIRCULAR PROGRESS MATRIX (गोल नियॉन घेरा) */
        .mining-vault-vertex {
            width: 260px; height: 260px; border-radius: 50%; border: 4px dashed #222222;
            margin: 0 auto 30px auto; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background-color: #0d0d0d; box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }
        .mining-active-state { border-color: #FFFFFF; box-shadow: 0 0 30px rgba(255,255,255,0.1), inset 0 0 20px rgba(255,255,255,0.05); animation: rotateOrbit 20s infinite linear; }
        @keyframes rotateOrbit { 100% { transform: rotate(360deg); } }
        
        .counter-inner-node { transform: rotate(0deg); text-align: center; position: absolute; z-index: 5; }
        .mining-active-state .counter-inner-node { animation: counterRotate 20s infinite linear reverse; }
        @keyframes counterRotate { 100% { transform: rotate(-360deg); } }

        .telemetry-label { font-size: 11px; font-weight: bold; color: #666666; text-transform: uppercase; letter-spacing: 1px; }
        .live-mb-value { font-size: 26px; font-weight: 900; color: #FFFFFF; margin: 5px 0; }
        .live-inr-balance { font-size: 32px; font-weight: 900; color: #FFFFFF; letter-spacing: -0.5px; }

        /* ⚡ MASTER STREAM CONTROL OPERATION TRIGGER */
        .stream-trigger-btn {
            width: 100%; padding: 16px; background-color: #FFFFFF; color: #000000;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 900;
            text-transform: uppercase; cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .stream-trigger-btn:active { transform: scale(0.98); }
        .btn-state-active { background-color: #161616 !important; color: #FF3B30 !important; border: 1px solid #222222; }

        /* 📱 BOTTOM NAVIGATION FIXED PLATFORM BAR */
        .bottom-nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #121212;
            border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 100; box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }
        .nav-item-link {
            text-decoration: none; color: #666666; display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;
        }
        .nav-item-link svg { width: 22px; height: 22px; fill: #666666; transition: all 0.2s ease; }
        .nav-active-node { color: #FFFFFF !important; }
        .nav-active-node svg { fill: #FFFFFF !important; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- 🛡️ CRITICAL PRIVACY ASSURANCE MATRIX INFRASTRUCTURE -->
        <div class="security-banner">
            <span>Security Note:</span> This application does not collect your personal data, photos, or passwords. It only securely monitors and sells your remaining unused 5G/4G bandwidth internet data.
        </div>

        <div style="text-align: center;">
            <!-- 🟢 24/7 AUTOMATED LIVE SIGNAL BADGE -->
            <div class="server-status-badge">
                <div class="live-dot"></div>
                <span>24/7 Network Engine: Active</span>
            </div>
        </div>

        <!-- 🔮 DYNAMIC PROGRESSIVE TELEMETRY VAULT VERTEX -->
        <div class="mining-vault-vertex" id="circular-mesh-node">
            <div class="counter-inner-node">
                <div class="telemetry-label" id="stream-status-text">Network Idle</div>
                <div class="live-mb-value" id="display-shared-mb">0.00 MB</div>
                <div class="telemetry-label">Current Yield</div>
                <div class="live-inr-balance" id="display-live-inr">₹0.00</div>
            </div>
        </div>

        <!-- ⚡ INITIALIZATION ACTION BUTTON CONTROL -->
        <button class="stream-trigger-btn" id="master-stream-btn" onclick="toggleDataMonetization()">Initialize Data Stream</button>

    </div>

    <!-- 📱 PROFESSIONAL FIXED NAVIGATION DECK FOOTER LAYER -->
    <nav class="bottom-nav-bar">
        <a href="/home.html" class="nav-item-link nav-active-node">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            <span>Home</span>
        </a>
        <a href="/account.html" class="nav-item-link">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Account</span>
        </a>
    </nav>
    <!-- ⚡ AUTOMATED progressive DATA INJECTION SCRIPTS -->
    <script>
        let isMiningActive = false;
        let dataLoopInterval = null;
        
        // 📈 प्रति MB रेट = ₹13.75 / 1024 MB = ₹0.0134277 (1.34 पैसे प्रति MB लाइव)
        const INR_PER_MB = 0.0134277; 

        // पेज लोड होते ही लोकल मेमोरी से पुराना डेटा रिकवर करना (नो-लॉस गारंटी)
        window.addEventListener('load', async () => {
            await synchronizeSessionData();
        });

        async function synchronizeSessionData() {
            try {
                const res = await fetch('/api/user/profile');
                const data = await res.json();
                if(data.success) {
                    // सर्वर डेटाबेस से सिंक की गई राशि को लाइव डिस्प्ले करना
                    document.getElementById('display-live-inr').innerText = `\u20B9${data.user.balance.toFixed(2)}`;
                    
                    // लोकल मेमोरी से करेंट MB सेशन रीस्टोर करना
                    const savedMB = localStorage.getItem('cached_shared_mb') || "0.00";
                    document.getElementById('display-shared-mb').innerText = `${parseFloat(savedMB).toFixed(2)} MB`;
                } else {
                    window.location.href = '/index.html';
                }
            } catch(e) {}
        }

        function toggleDataMonetization() {
            const meshNode = document.getElementById('circular-mesh-node');
            const masterBtn = document.getElementById('master-stream-btn');
            const statusText = document.getElementById('stream-status-text');

            if(!isMiningActive) {
                // 🟢 डेटा शेयरिंग इंजन को लाइव एक्टिवेट करना
                isMiningActive = true;
                meshNode.classList.add('mining-active-state');
                masterBtn.innerText = "Terminate Data Stream";
                masterBtn.classList.add('btn-state-active');
                statusText.innerText = "Mining Active";
                statusText.style.color = "#00FFCC";
                
                // 1-1 MB लाइव प्रोग्रेसिव लूप ट्रिगर करना
                executeLiveBandwidthTunneling();
            } else {
                // 🔴 डेटा शेयरिंग इंजन को मैन्युअली स्टॉप करना
                haltDataMonetization();
            }
        }

        function haltDataMonetization() {
            const meshNode = document.getElementById('circular-mesh-node');
            const masterBtn = document.getElementById('master-stream-btn');
            const statusText = document.getElementById('stream-status-text');

            isMiningActive = false;
            clearInterval(dataLoopInterval);
            meshNode.classList.remove('mining-active-state');
            masterBtn.innerText = "Initialize Data Stream";
            masterBtn.classList.remove('btn-state-active');
            statusText.innerText = "Network Idle";
            statusText.style.color = "#666666";
        }

        function executeLiveBandwidthTunneling() {
            dataLoopInterval = setInterval(async () => {
                if(!isMiningActive) return;

                let currentMB = parseFloat(localStorage.getItem('cached_shared_mb') || "0.00");
                
                // हर टिक पर 1 MB लाइव पैकेट जोड़ना
                currentMB += 1.00; 
                localStorage.setItem('cached_shared_mb', currentMB);
                document.getElementById('display-shared-mb').innerText = `${currentMB.toFixed(2)} MB`;

                // 1.34 पैसे का लाइव रीयल-टाइम एडिशन फ़ॉर्मूला
                try {
                    const res = await fetch('/api/user/add-bandwidth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mbAmount: 1.00, creditAmount: INR_PER_MB })
                    });
                    const data = await res.json();
                    if(data.success) {
                        // रुपये (₹) में बिना पेज रिफ्रेश किए लाइव बैलेंस बढ़ाना
                        document.getElementById('display-live-inr').innerText = `\u20B9${data.newBalance.toFixed(4)}`;
                    }
                } catch(e) {}

            }, 2500); // सिम्युलेटेड हाई-स्पीड 5G डेटा टनलिंग रेट
        }
    </script>
</body>
</html>
